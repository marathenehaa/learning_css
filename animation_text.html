<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .text_container{
           display: flex;
           align-items: center;
           justify-content: center;
           font-family: sans-serif;
           letter-spacing: 4px;
           font-size: 80px;
           font-weight: 800;
           perspective: 100px;
        }
        .text_container>b{
            height: 90px;
            box-shadow: 0px 10px 5px gray;
            /* background-color: darkgreen; */
            background: linear-gradient(to right, purple, pink, purple);
            background-clip: text;
            color: transparent;
            transform-origin: bottom;
            animation: getUpDown 5s infinite;
        }

        .text_container > b:nth-child(1) {animation-delay: 0s;}
        .text_container > b:nth-child(2) {animation-delay: 0.25s;}
        .text_container > b:nth-child(3) {animation-delay: 0.50s;}
        .text_container > b:nth-child(4) {animation-delay: 0.75s;}

        @keyframes getUpDown{
            from {transform: rotate(-85deg);}
            10%,50%{transform: rotateX(0);}
            60%, to{transform: rotateX(-85deg);}
        }

    </style>
</head>
<body>
    <div class="text_container">
        <b>N</b><b>E</b><b>H</b><b>A</b>
    </div>
</body>
</html>
