<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="nth_child.html">
    <style>
    ul{
    width: 200px;
    padding: 10px;
    list-style-type: none;
    font-weight: 700;
    }
    li{
    padding: 10px;
    border: 5px solid darkred;
    margin-bottom: 5px;
    border-radius: 10px;
    }
    li:nth-child(odd){
    background-color: yellow;
    }
    li:nth-child(even){
    background-color: darkmagenta;
    }
    
    </style>
</head>
<body>
    <!-- ul>li*8{Item $} -->
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
        <li>Item 6</li>
        <li>Item 7</li>
        <li>Item 8</li>
    </ul>
</body>
</html>
