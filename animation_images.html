<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .animation_img{
    width: 300px;              
    height: 300px;             
    position: relative;
    background-repeat: no-repeat;
    background-position: center;
    background-size: 300px 300px;   
    animation-name: movingimage;
    animation-iteration-count: infinite; 
    animation-direction: alternate;
    animation-delay: 2s;
    animation-duration: 10s;
    border: 10px solid black;
    }

   @keyframes movingimage{
    0%{
        left:0px;
        top:0px;
        background-image:url("images/butterfly3.jpg");
        border: 10px solid brown;
    }

    25%{
        left:300px;
        top:0px;
        background-image:url("images/butterfly4.jpg");
        border: 10px solid darkblue;
    }

    50%{
        left:300px;
        top:300px;
        background-image:url("images/butterfly7.jpg");
        border: 10px solid orange;
    }

    75%{
        left:0px;
        top:300px;
        background-image:url("images/butterfly10.jpg");
        border: 10px solid palevioletred;
    }

    100%{
        left:0px;
        top:0px;
        background-image:url("images/butterfly3.jpg");
        border: 10px solid black;
    }
}

</style>
</head>
<body>
    <div class="animation_img"></div>
</body>
</html>
